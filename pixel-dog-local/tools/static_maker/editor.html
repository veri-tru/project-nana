<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nana · 개체 제작실</title>
<style>
:root{font:15px system-ui,sans-serif;color:#352f29;background:#f4f0e9}*{box-sizing:border-box}body{margin:0}header{padding:20px 28px;border-bottom:1px solid #d7d0c5;background:#fffdf8;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:23px;margin:0}header p{margin:5px 0 0;color:#75695d;font-size:13px}main{display:grid;grid-template-columns:300px 1fr;max-width:1500px;margin:auto}aside{padding:20px;background:#fffdf8;border-right:1px solid #ddd4c8;height:calc(100vh - 90px);overflow:auto}article{padding:20px}h2{font-size:16px;margin:10px 0}label.control{display:grid;grid-template-columns:1fr 62px;align-items:center;gap:7px;margin:12px 0}.control input[type=range]{grid-column:1/-1;width:100%}input,select,button{font:inherit}input[type=number]{width:62px;padding:4px;border:1px solid #d5c9ba;border-radius:4px}button{border:1px solid #b9aa98;background:#fffdf8;border-radius:6px;padding:8px 12px;cursor:pointer}button.primary{background:#52675a;color:white;border-color:#52675a}button:disabled{opacity:.5;cursor:default}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}#status{padding:10px 12px;background:#e8eee7;border-radius:6px;min-height:38px}.error{background:#f7e0d8!important;color:#853c31}#grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:18px 0}figure{margin:0;border:1px solid #ddd2c4;background:#fffcf5;border-radius:12px;overflow:hidden}figcaption{padding:12px 15px;font-weight:650;border-bottom:1px solid #e8e0d6;display:flex;justify-content:space-between}.pair{display:flex;justify-content:space-evenly;padding:14px;gap:10px}.sample{min-width:0;text-align:center}.sample small{display:block;color:#837365;margin-bottom:8px}.canvas{position:relative;margin:auto;width:192px;max-width:100%;aspect-ratio:1}.canvas img{image-rendering:pixelated;width:100%;height:100%;position:absolute;inset:0}.before{display:none}body.compare .before{display:block}.overlay{display:none}body.overlay-on .overlay{display:block}body.native .canvas{width:96px}#reason{width:100%;padding:7px;margin:9px 0;border:1px solid #cbbfad;border-radius:5px}.muted{color:#837365;font-size:12px;line-height:1.5}details{padding:10px 0;border-top:1px solid #e5dccf}summary{cursor:pointer;font-weight:600}#history{width:100%;padding:6px;margin:10px 0}.coat{display:flex;justify-content:space-between;margin:10px 0}select{padding:5px;border:1px solid #cbbfad;border-radius:5px;background:#fffdf8}@media(max-width:850px){main{grid-template-columns:1fr}aside{height:auto;border-right:0}#grid{grid-template-columns:1fr}.canvas{width:288px}header{align-items:flex-start}}
</style>
<header><div><h1>Nana · 개체 제작실 <small id="buildVersion" style="font-size:13px">0.2</small></h1><p>정면 얼굴과 앉은 전신 · 같은 개체의 B2 / C2 비교</p></div><span id="revision">불러오는 중</span></header>
<main><aside><button id="upgrade" hidden>0.3 제작 구조로 이관</button><h2>얼굴·몸 조절</h2><div id="geometry"></div><details><summary>세부 치수</summary><div id="advanced"></div></details><details open><summary>부위별 털</summary><div id="coat"></div><label><input type="checkbox" id="collar"> 목줄 표시</label></details><details><summary>색상</summary><div id="palette"></div></details><h2>초안 저장</h2><input id="reason" placeholder="수정 이유" aria-label="수정 이유"><button id="save" class="primary" disabled>새 초안 저장</button> <button id="reset">저장본으로 복원</button><select id="history" aria-label="이전 제작 상태"></select><button id="restore">선택한 버전을 새 초안으로 복원</button><p class="muted">제작 상태만 저장합니다. 관찰 프로필과 이전 기록은 유지됩니다. 현재 결과는 닮음·정본 미감 검수 전입니다.</p></aside>
<article><div class="toolbar"><label><input id="compare" type="checkbox"> <span id="compareLabel">0.1과 비교</span></label><label><input id="overlay" type="checkbox"> 연결점·눈 가림 표시</label><label><input id="native" type="checkbox"> 원본 1배</label><button id="refresh">미리보기 갱신</button></div><div id="status" role="status" aria-live="polite">제작 상태를 불러옵니다.</div><div id="grid"></div><details><summary>사용 버전·검증 정보</summary><pre id="metadata" style="white-space:pre-wrap;font-size:12px"></pre></details></article></main>
<script>
const token='__SESSION_TOKEN__';let state,baseline,revision,ranges,legacy={},lastPreview,seq=0,timer,valid=false,busy=false,renderLabel="0.2",comparisonLabel="0.1";
const $=id=>document.getElementById(id),clone=x=>structuredClone(x);
const labels={head_width:'얼굴 폭',head_height:'얼굴 높이',jaw_width:'아래 얼굴 폭',ear_width:'귀 폭',ear_length:'귀 길이',eye_spacing:'눈 간격',eye_rx:'눈 가로 반경',eye_ry:'눈 세로 반경',eye_y:'눈 높이',eye_tilt:'눈 기울기',left_eye_offset:'화면 왼눈 높이차',right_eye_offset:'화면 오른눈 높이차',muzzle_width:'주둥이 폭',muzzle_height:'주둥이 높이',muzzle_offset:'주둥이 위치',nose_width:'코 폭',nose_height:'코 높이',body_width:'몸통 폭',body_height:'몸통 높이',leg_width:'다리 폭',left_occlusion:'화면 왼눈 가림',right_occlusion:'화면 오른눈 가림'};
Object.assign(labels,{head_drop:'머리 내림',neck_width:'목 폭',shoulder_width:'어깨 폭',haunch_width:'골반 폭',foot_spacing:'앞발 간격',muzzle_lobe_depth:'주둥이 두 볼 구분',pupil_percent:'동공 비율 (%)'});
const primary=['head_drop','shoulder_width','haunch_width','foot_spacing','head_width','head_height','ear_length','eye_spacing','eye_rx','eye_ry','muzzle_width','body_height'];
function setBusy(value){busy=value;document.querySelectorAll('aside input,aside select,aside button').forEach(el=>el.disabled=value);if(!value)$('save').disabled=!valid}
function status(text,error=false){$('status').textContent=text;$('status').classList.toggle('error',error)}
async function api(path,data){const r=await fetch(path,{method:data?'POST':'GET',headers:data?{'Content-Type':'application/json','X-Nana-Session':token}:{},body:data?JSON.stringify(data):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||r.statusText);return d}
function invalidate(){valid=false;seq++;$('save').disabled=true;clearTimeout(timer);status('조정 중 · 아직 저장하지 않았습니다.');timer=setTimeout(update,180)}
function controls(){for(const id of ['geometry','advanced','coat','palette'])$(id).replaceChildren();for(const [k,[min,max]] of Object.entries(ranges)){const l=document.createElement('label');l.className='control';const title=document.createElement('span');title.textContent=labels[k]||k;const number=document.createElement('input');number.type='number';number.min=min;number.max=max;number.step=1;number.value=state.geometry[k];number.id='number-'+k;number.setAttribute('aria-label',title.textContent);const slider=document.createElement('input');slider.type='range';slider.min=min;slider.max=max;slider.step=1;slider.value=state.geometry[k];slider.id='range-'+k;slider.setAttribute('aria-label',title.textContent+' 슬라이더');const change=(e)=>{state.geometry[k]=Number(e.target.value);number.value=state.geometry[k];slider.value=state.geometry[k];invalidate()};number.addEventListener('input',change);slider.addEventListener('input',change);l.append(title,number,slider);$(primary.includes(k)?'geometry':'advanced').append(l)}for(const [k,title] of Object.entries({crown:'정수리',ears:'귀 끝',cheeks:'볼·턱',chest:'가슴',paws:'발 둘레'})){const row=document.createElement('label');row.className='coat';row.textContent=title;const select=document.createElement('select');select.id='coat-'+k;for(const [v,t] of [['short','짧게'],['medium','중간'],['long','길게']]){const o=new Option(t,v);select.add(o)}select.value=state.coat[k];select.onchange=()=>{state.coat[k]=select.value;invalidate()};row.append(select);$('coat').append(row)}for(const [k,v] of Object.entries(state.colors)){const l=document.createElement('label');l.className='coat';l.textContent=k;const input=document.createElement('input');input.type='color';input.value=v;input.oninput=()=>{state.colors[k]=input.value;invalidate()};l.append(input);$('palette').append(l)}$('collar').checked=state.collar_visible;$('collar').onchange=()=>{state.collar_visible=$('collar').checked;invalidate()}}
function display(data){lastPreview=data;$('grid').replaceChildren();for(const [key,item] of Object.entries(data)){const fig=document.createElement('figure');const cap=document.createElement('figcaption');cap.textContent=(key.startsWith('face')?'얼굴':'앉은 전신')+' · '+key.split('-')[1];const pair=document.createElement('div');pair.className='pair';for(const old of [true,false]){const sample=document.createElement('div');sample.className='sample'+(old?' before':'');const caption=document.createElement('small');caption.textContent=old?comparisonLabel+' 기준':renderLabel+' 제작 초안';const canvas=document.createElement('div');canvas.className='canvas';const img=new Image();img.alt=key+(old?' 이전':' 현재');img.src=old?legacy[key]:item.image;canvas.append(img);if(!old){const overlay=new Image();overlay.className='overlay';overlay.alt='연결점과 눈 가림';overlay.src=item.overlay;canvas.append(overlay)}sample.append(caption,canvas);pair.append(sample)}fig.append(cap,pair);$('grid').append(fig)}$('metadata').textContent=JSON.stringify({dog_id:state.dog_id,profile:state.source_profile,package:state.package,geometry_hash:data['full-B2'].meta.geometry_sha256,pixels:data['full-B2'].meta.rgba_sha256,colors:data['full-B2'].meta.opaque_color_count,review:state.review},null,2)}
function history(items){$('history').replaceChildren();for(const [rev,parent,reason] of items){const o=new Option('v'+rev+' · '+reason,rev);$('history').add(o)}$('history').value=revision;$('revision').textContent='제작 상태 v'+revision+' · 프로필 v'+state.source_profile.revision}
async function update(){clearTimeout(timer);const request=++seq;valid=false;$('save').disabled=true;try{const d=await api('/api/preview',{state:clone(state)});if(request!==seq)return;display(d.preview);valid=true;$('save').disabled=busy;status('미리보기 갱신 완료 · 저장 전 초안입니다.')}catch(e){if(request!==seq)return;status('지원하지 않는 조합: '+e.message,true)}}
function configure(d){ranges=d.ranges;legacy=d.legacy;renderLabel=d.render_label||'0.2';comparisonLabel=d.comparison_label||'0.1';$('buildVersion').textContent=renderLabel;$('compareLabel').textContent=comparisonLabel+'과 비교';$('upgrade').hidden=!d.can_migrate}
async function load(){const d=await api('/api/state');state=clone(d.state);baseline=clone(d.state);revision=d.revision;configure(d);controls();history(d.history);display(d.preview);valid=true;$('save').disabled=false;status('저장된 제작 상태를 불러왔습니다. 수정 후 새 초안으로 저장하세요.')}
$('save').onclick=async()=>{if(!valid||busy)return;if(!$('reason').value.trim())return status('수정 이유를 입력하세요.',true);setBusy(true);clearTimeout(timer);const request=++seq;const submitted=clone(state);try{const d=await api('/api/save',{state:submitted,expected:revision,reason:$('reason').value.trim()});baseline=clone(d.state);revision=d.revision;configure(d);history(d.history);if(request===seq){state=clone(d.state);controls();display(d.preview);valid=true;status('제작 상태 v'+revision+' 저장 완료. 관찰 프로필은 유지됩니다.')}else{status('제출한 초안 저장 완료. 이후 조정은 아직 저장하지 않았습니다.');update()}$('reason').value=''}catch(e){status(e.message,true)}finally{setBusy(false)}};
$('reset').onclick=()=>{state=clone(baseline);controls();invalidate();update()};
$('restore').onclick=async()=>{if(busy)return;setBusy(true);clearTimeout(timer);seq++;try{const d=await api('/api/restore',{target:Number($('history').value),expected:revision});state=clone(d.state);baseline=clone(d.state);revision=d.revision;configure(d);controls();history(d.history);display(d.preview);valid=true;status('이전 내용을 새 제작 상태 v'+revision+'으로 복원했습니다.')}catch(e){status(e.message,true)}finally{setBusy(false)}};
$('upgrade').onclick=async()=>{if(busy)return;if(JSON.stringify(state)!==JSON.stringify(baseline))return status('현재 조정을 먼저 저장하거나 저장본으로 복원한 뒤 이관하세요.',true);setBusy(true);clearTimeout(timer);seq++;try{const d=await api('/api/migrate',{expected:revision});state=clone(d.state);baseline=clone(d.state);revision=d.revision;configure(d);controls();history(d.history);display(d.preview);valid=true;status('0.3 구조로 새 초안을 만들었습니다. 이전 제작 상태는 보존됩니다.')}catch(e){status(e.message,true)}finally{setBusy(false)}};
$('refresh').onclick=update;for(const [id,cls] of [['compare','compare'],['overlay','overlay-on'],['native','native']])$(id).onchange=()=>document.body.classList.toggle(cls,$(id).checked);load().catch(e=>status(e.message,true));
</script></html>
